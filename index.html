<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="./images/Logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A&P Imports | Produtos importados</title>
    <meta name="description" content="Perfumes, eletrônicos, cosméticos e muito mais. Produtos importados selecionados com atendimento personalizado pelo WhatsApp." />
    <meta name="theme-color" content="#080808" />
    <link rel="canonical" href="https://ap-imports.vip/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ap-imports.vip/" />
    <meta property="og:title" content="A&P Imports | Produtos importados" />
    <meta property="og:description" content="Perfumes, eletrônicos, cosméticos e muito mais, com atendimento personalizado pelo WhatsApp." />
    <meta property="og:site_name" content="A&amp;P Imports" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="https://ap-imports.vip/images/og-banner.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A&amp;P Imports — Qualidade sem fronteiras. Perfumes, eletrônicos, acessórios e muito mais." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="A&amp;P Imports | Produtos importados" />
    <meta name="twitter:description" content="Perfumes, eletrônicos, cosméticos e muito mais, com atendimento personalizado pelo WhatsApp." />
    <meta name="twitter:image" content="https://ap-imports.vip/images/og-banner.jpg" />
    <meta name="twitter:image:alt" content="A&amp;P Imports — Qualidade sem fronteiras. Perfumes, eletrônicos, acessórios e muito mais." />
    <link rel="stylesheet" href="./styles.css?v=full-banner-1" />
  </head>
  <body>
    <main>
      <section id="catalogo" class="catalog-container" aria-labelledby="catalog-title">
        <div class="catalog-banner">
          <h1 id="catalog-title" class="sr-only">A&amp;P Imports — Qualidade sem fronteiras.</h1>
          <img class="catalog-banner-image" src="./images/catalog-banner.jpg" alt="Produtos importados. Perfumes, eletrônicos, acessórios e muito mais." width="1732" height="908" fetchpriority="high" />
        </div>
        <section class="products" id="produtos" aria-labelledby="products-title">
          <div class="products-container">
            <h2 id="products-title" class="sr-only">Catálogo de produtos</h2>
            <div class="products-controls" id="categorias">
              <div id="category-field" class="products-sort-field products-category-field"></div>
              <div class="products-results-actions" hidden>
                <div id="sort-field" class="products-sort-field"></div>
                <button type="button" class="products-reset is-hidden" disabled aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>Limpar filtros</button>
              </div>
            </div>
            <div class="product-search">
              <form class="navbar-search" role="search">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search" aria-hidden="true"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg>
                <input type="search" placeholder="Buscar produto..." aria-label="Buscar produtos" />
                <button type="button" aria-label="Limpar busca" hidden><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
              </form>
            </div>
            <div class="products-results" hidden><p class="products-count" aria-live="polite" aria-atomic="true"></p></div>
            <div class="products-content" role="region" aria-label="Resultados do catálogo" tabindex="0">
              <div class="products-loading" role="status">
                <p class="sr-only">Carregando nossa seleção...</p>
                <div class="products-grid" aria-hidden="true"><div class="product-skeleton"></div><div class="product-skeleton"></div><div class="product-skeleton"></div></div>
              </div>
            </div>
          </div>
        </section>
        <div class="catalog-assistance">
          <span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-message-circle" aria-hidden="true"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"></path></svg> Dúvidas sobre algum produto? A gente ajuda você a escolher.</span>
          <a href="#contato" data-scroll="contato">Converse com a equipe <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-down-right" aria-hidden="true"><path d="m7 7 10 10"></path><path d="M17 7v10H7"></path></svg></a>
        </div>
        <section id="contato" class="contact" aria-labelledby="contact-title">
          <div class="contact-container">
            <div class="contact-heading">
              <span class="contact-label">ATENDIMENTO A&amp;P IMPORTS</span>
              <h2 id="contact-title">Fale com nossa <span>equipe.</span></h2>
            </div>
            <div class="contact-team"></div>
            <footer class="contact-footer">
              <span>A&amp;P IMPORTS</span>
              <span>© <span id="current-year"></span> A&amp;P Imports. Todos os direitos reservados.</span>
              <a href="#catalogo" data-scroll="catalogo">Voltar ao catálogo <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right" aria-hidden="true"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></a>
            </footer>
          </div>
        </section>
      </section>
    </main>
    <noscript><p>Ative o JavaScript para consultar os produtos e os contatos.</p></noscript>
    <script src="./script.js"></script>
  </body>
</html>
